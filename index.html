<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Auto Service — Agenda</title>
<meta name="theme-color" content="#0b0d10">
<style>
:root {
  --bg:#090b0e; --panel:#11151a; --panel2:#171c22; --text:#f6f7f9;
  --muted:#9ca6b3; --line:#252c35; --accent:#f2f4f7; --danger:#ff6767;
  --ok:#71d59a; --warn:#f1c86d; --blue:#74a7ff; --shadow:0 20px 60px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 0 0,#1a2028 0,#0b0e12 42%,#080a0d 100%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;min-height:100%}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.shell{max-width:1180px;margin:auto;padding:24px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:14px}
.logoWrap{width:76px;height:76px;border-radius:20px;background:white;overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow);border:1px solid #dfe3e8}
.logoWrap img{width:138%;height:138%;object-fit:cover;object-position:54% 46%;filter:grayscale(1) contrast(1.25)}
.brand h1{margin:0;font-size:clamp(22px,3vw,34px);letter-spacing:.2px}
.brand p{margin:4px 0 0;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:11px 14px;border-radius:13px;font-weight:700}
.btn:hover{transform:translateY(-1px);border-color:#3a4552}
.btn.primary{background:#f5f6f8;color:#0b0d10;border-color:#f5f6f8}
.btn.danger{color:#ff9b9b}
.hero{display:grid;grid-template-columns:1.4fr .6fr;gap:16px;margin-bottom:18px}
.card{background:linear-gradient(180deg,rgba(23,28,34,.94),rgba(13,16,21,.96));border:1px solid var(--line);border-radius:22px;padding:20px;box-shadow:var(--shadow)}
.heroMain{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;min-height:150px}
.kicker{color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:1.4px;font-weight:800}
.bigDate{font-size:clamp(27px,5vw,52px);font-weight:900;line-height:1.03;margin-top:8px}
.stat{font-size:42px;font-weight:900}
.statLabel{color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.toolbar input,.toolbar select{background:#0c1015;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:12px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:#657283}
.dateInput{min-width:160px}
.search{flex:1;min-width:220px}
.agenda{display:grid;gap:16px}
.day{background:rgba(15,19,24,.9);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.dayHead{display:flex;justify-content:space-between;align-items:center;padding:15px 17px;background:#12171d;border-bottom:1px solid var(--line)}
.dayTitle{font-weight:900;font-size:17px}
.dayCount{color:var(--muted);font-size:13px}
.items{display:grid}
.item{display:grid;grid-template-columns:1.2fr 1fr .9fr auto;gap:14px;align-items:center;padding:15px 17px;border-bottom:1px solid #1d232b}
.item:last-child{border-bottom:none}
.customer{font-weight:800}
.meta,.notes{color:var(--muted);font-size:13px;margin-top:4px}
.service{font-weight:700}
.badge{display:inline-flex;align-items:center;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:900;border:1px solid transparent;white-space:nowrap}
.badge.agendado{background:rgba(116,167,255,.12);color:#a9c8ff;border-color:rgba(116,167,255,.3)}
.badge.andamento{background:rgba(241,200,109,.12);color:#f7d992;border-color:rgba(241,200,109,.3)}
.badge.pronto{background:rgba(113,213,154,.12);color:#9ae6b9;border-color:rgba(113,213,154,.3)}
.badge.entregue{background:rgba(255,255,255,.08);color:#d8dde3;border-color:#3a424d}
.itemBtns{display:flex;gap:7px}
.iconBtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:#141a20;color:#fff}
.empty{padding:42px 18px;text-align:center;color:var(--muted);border:1px dashed #303944;border-radius:18px}
.modalBack{position:fixed;inset:0;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:18px;z-index:20}
.modal{width:min(680px,100%);max-height:92vh;overflow:auto;background:#101419;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 35px 120px rgba(0,0,0,.7)}
.modal h2{margin:0 0 17px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:7px;margin-bottom:12px}
.field label{font-size:13px;color:#bac1c9;font-weight:800}
.field input,.field select,.field textarea{width:100%;background:#0a0d11;border:1px solid var(--line);color:#fff;padding:12px 13px;border-radius:12px;outline:none}
.field textarea{min-height:90px;resize:vertical}
.modalFooter{display:flex;justify-content:flex-end;gap:10px;margin-top:8px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.loginCard{width:min(430px,100%);text-align:center;background:linear-gradient(180deg,#171c22,#0d1116);border:1px solid var(--line);border-radius:28px;padding:30px;box-shadow:var(--shadow)}
.loginLogo{width:118px;height:118px;margin:0 auto 18px;background:#fff;border-radius:28px;overflow:hidden}
.loginLogo img{width:145%;height:145%;object-fit:cover;object-position:54% 46%;filter:grayscale(1) contrast(1.25)}
.loginCard h1{margin:4px 0 7px}
.loginCard p{color:var(--muted);margin:0 0 20px}
.loginCard input{width:100%;background:#0a0d11;border:1px solid var(--line);color:#fff;padding:13px;border-radius:13px;margin:7px 0}
.loginCard .btn{width:100%;margin-top:8px}
.loginMsg{min-height:20px;color:#ff9a9a;font-size:13px;margin-top:10px}
.small{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:780px){
  .shell{padding:15px}
  .topbar{align-items:flex-start;flex-direction:column}
  .hero{grid-template-columns:1fr}
  .heroMain{min-height:125px}
  .item{grid-template-columns:1fr auto}
  .item>div:nth-child(2),.item>div:nth-child(3){grid-column:1}
  .itemBtns{grid-column:2;grid-row:1 / span 3;flex-direction:column}
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

const load=()=>JSON.parse(localStorage.getItem(KEY)||'[]');
const save=d=>localStorage.setItem(KEY,JSON.stringify(d));
const fmtDate=d=>new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(new Date(d+'T12:00:00'));
const fmtShort=d=>new Intl.DateTimeFormat('pt-BR').format(new Date(d+'T12:00:00'));
const today=()=>new Date().toISOString().slice(0,10);
let data=load();

function setupLogin(){
  $('#password2').classList.add('hidden');
  $('#loginSubtitle').textContent='Digite a senha para abrir a agenda.';
  $('#loginBtn').textContent='Entrar';
}
$('#loginBtn').onclick=()=>{
  const p=$('#password').value;
  if(p===FIXED_PASS) enter();
  else $('#loginMsg').textContent='Senha incorreta.';
}
function enter(){
  $('#loginScreen').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#password').value=''; $('#password2').value=''; $('#loginMsg').textContent='';
  render();
}
$('#logoutBtn').onclick=()=>{$('#app').classList.add('hidden');$('#loginScreen').classList.remove('hidden');setupLogin();};

function render(){
  data=load();
  $('#heroDate').textContent=new Intl.DateTimeFormat('pt-BR',{month:'long',year:'numeric'}).format(new Date());
  $('#totalStat').textContent=data.length;
  $('#todayStat').textContent=data.filter(x=>x.date===today() && x.status!=='Entregue').length;
  const fd=$('#filterDate').value, fs=$('#filterStatus').value, q=$('#search').value.trim().toLowerCase();
  let rows=data.filter(x=>(!fd||x.date===fd)&&(!fs||x.status===fs)&&(!q||[x.customer,x.phone,x.vehicle,x.plate,x.service,x.color,x.notes].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>a.date.localeCompare(b.date)||a.customer.localeCompare(b.customer));
  const groups={}; rows.forEach(x=>(groups[x.date]??=[]).push(x));
  const root=$('#agenda'); root.innerHTML='';
  if(!rows.length){root.innerHTML='<div class="empty">Nenhum agendamento encontrado.</div>';return;}
  Object.entries(groups).forEach(([date,items])=>{
    const el=document.createElement('section'); el.className='day';
    el.innerHTML=`<div class="dayHead"><div class="dayTitle">${esc(fmtDate(date))}</div><div class="dayCount">${items.length} serviço${items.length>1?'s':''}</div></div>
      <div class="items">${items.map(x=>`<article class="item">
        <div><div class="customer">${esc(x.customer)}</div><div class="meta">${esc(x.vehicle)}${x.plate?' • '+esc(x.plate):''}${x.phone?' • '+esc(x.phone):''}</div>${x.notes?`<div class="notes">${esc(x.notes)}</div>`:''}</div>
        <div><div class="service">${esc(x.service)}</div><div class="meta">${x.color?esc(x.color):'Cor não informada'}</div></div>
        <div><span class="badge ${x.status==='Agendado'?'agendado':x.status==='Em andamento'?'andamento':x.status==='Pronto'?'pronto':'entregue'}">${esc(x.status)}</span></div>
        <div class="itemBtns"><button class="iconBtn" title="Editar" onclick="editItem('${x.id}')">✎</button><button class="iconBtn" title="Excluir" onclick="deleteItem('${x.id}')">×</button></div>
      </article>`).join('')}</div>`;
    root.appendChild(el);
  });
}
['filterDate','filterStatus','search'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#clearFilters').onclick=()=>{$('#filterDate').value='';$('#filterStatus').value='';$('#search').value='';render();};

function openModal(item=null){
  $('#modalTitle').textContent=item?'Editar agendamento':'Novo agendamento';
  $('#editId').value=item?.id||'';
  $('#date').value=item?.date||today(); $('#status').value=item?.status||'Agendado';
  $('#customer').value=item?.customer||''; $('#phone').value=item?.phone||'';
  $('#vehicle').value=item?.vehicle||''; $('#plate').value=item?.plate||'';
  $('#service').value=item?.service||'Lanternagem'; $('#color').value=item?.color||'';
  $('#notes').value=item?.notes||''; $('#modalBack').classList.remove('hidden');
}
function closeModal(){$('#modalBack').classList.add('hidden')}
$('#newBtn').onclick=()=>openModal();
$('#cancelBtn').onclick=closeModal;
$('#modalBack').addEventListener('click',e=>{if(e.target===$('#modalBack'))closeModal()});
$('#form').onsubmit=e=>{
  e.preventDefault();
  const id=$('#editId').value||crypto.randomUUID();
  const item={id,date:$('#date').value,status:$('#status').value,customer:$('#customer').value.trim(),phone:$('#phone').value.trim(),vehicle:$('#vehicle').value.trim(),plate:$('#plate').value.trim().toUpperCase(),service:$('#service').value,color:$('#color').value.trim(),notes:$('#notes').value.trim()};
  const i=data.findIndex(x=>x.id===id); if(i>=0)data[i]=item;else data.push(item);
  save(data);closeModal();render();
}
window.editItem=id=>openModal(load().find(x=>x.id===id));
window.deleteItem=id=>{if(confirm('Excluir este agendamento?')){save(load().filter(x=>x.id!==id));render();}};

$('#exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='agenda-auto-service.json';a.click();URL.revokeObjectURL(a.href);
}
$('#importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d))throw 0;save(d);render();alert('Agenda importada com sucesso.')}catch{alert('Arquivo inválido.')}};r.readAsText(f); e.target.value='';
}
setupLogin();
</script>
</body>
</html>
